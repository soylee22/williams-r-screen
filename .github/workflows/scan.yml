name: Daily Williams %R scan

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 09:30 UTC weekdays -- prior US session settled, off the top-of-hour pile-up
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fetch price top-up
        run: python3 scripts/fetch.py

      - name: Run screen
        run: python3 scripts/scan.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "scan: daily Williams %R refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
